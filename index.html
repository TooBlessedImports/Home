<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Too Blessed Imports</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='8' fill='%230a0a0a'/%3E%3Ctext x='50' y='38' font-family='serif' font-size='28' font-weight='900' fill='white' text-anchor='middle' letter-spacing='-1'%3ETB%3C/text%3E%3Ctext x='50' y='62' font-family='sans-serif' font-size='10' fill='%23666' text-anchor='middle' letter-spacing='3'%3EIMPORTS%3C/text%3E%3C/svg%3E"/>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0;}

  :root{
    --bg:#0a0a0a;--bg2:#0f0f0f;--bg3:#111;
    --border:#1a1a1a;--border2:#222;
    --text:#e8e8e8;--muted:#555;
    --green:#25D366;--red:#c0392b;
  }

  .sr{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* HEADER */
  .hdr{background:var(--bg);border-bottom:1px solid #1e1e1e;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:200;gap:1rem;min-height:64px;max-height:64px;overflow:hidden;}
  .logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:5px;color:#fff;line-height:1;flex-shrink:0;}
  .logo span{color:var(--muted);font-size:10px;letter-spacing:3px;display:block;font-family:'DM Sans',sans-serif;font-weight:300;text-transform:uppercase;margin-top:2px;}
  .nav-scroll{flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#444 var(--bg);}
  .nav-scroll::-webkit-scrollbar{height:3px;}
  .nav-scroll::-webkit-scrollbar-track{background:var(--bg);}
  .nav-scroll::-webkit-scrollbar-thumb{background:#444;border-radius:10px;}
  .nav-links{display:flex;gap:1.5rem;list-style:none;white-space:nowrap;width:max-content;}
  .nav-links button{background:none;border:none;border-bottom:1px solid transparent;color:#666;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:color .2s,border-color .2s;padding:4px 0;white-space:nowrap;}
  .nav-links button:hover,.nav-links button.active{color:#fff;border-bottom-color:#fff;}
  .hdr-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}

  /* CART BUTTON */
  .cart-btn{position:relative;background:none;border:1px solid var(--border2);color:var(--muted);padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all .2s;display:flex;align-items:center;gap:7px;white-space:nowrap;}
  .cart-btn:hover{border-color:#555;color:#aaa;}
  .cart-badge{background:#fff;color:#000;font-size:9px;font-weight:600;min-width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
  .cart-badge.bump{transform:scale(1.5);}
  .cart-badge.hidden{display:none;}

  /* BRAND BAR */
  .brand-bar{padding:.7rem 2rem;display:flex;gap:6px;align-items:center;border-bottom:1px solid #0f0f0f;overflow-x:auto;min-height:44px;}
  .brand-bar.hidden{display:none;}
  .brand-lbl{font-size:10px;letter-spacing:2px;color:#2a2a2a;text-transform:uppercase;margin-right:6px;white-space:nowrap;}
  .brbtn{background:none;border:1px solid var(--border);color:#444;padding:4px 12px;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:1.5px;cursor:pointer;border-radius:2px;transition:all .2s;text-transform:uppercase;white-space:nowrap;}
  .brbtn:hover{border-color:#444;color:#888;}
  .brbtn.active{background:#e8e8e8;border-color:#e8e8e8;color:#000;}

  /* GRID */
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--bg);padding:12px;}
  .pcard{background:var(--bg2);cursor:pointer;transition:background .25s;border-radius:3px;overflow:hidden;border:1px solid #161616;}
  .pcard:hover{background:#141414;border-color:var(--border2);}
  .pcard:hover .pimg-inner{transform:scale(1.04);}
  .img-wrap{width:100%;aspect-ratio:3/4;overflow:hidden;background:var(--bg3);position:relative;}
  .pimg-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;transition:transform .55s cubic-bezier(.25,.46,.45,.94);overflow:hidden;}
  .pimg-inner svg{opacity:.12;}
  .pimg-inner img{width:100%;height:100%;object-fit:contain;display:block;}
  .badge{position:absolute;top:14px;left:14px;font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:2px;}
  .badge-novo{background:#fff;color:#000;}
  .badge-destaque{background:#252525;color:#aaa;border:1px solid #333;}
  .badge-sale{background:var(--red);color:#fff;}
  .disc-seal{position:absolute;top:14px;right:14px;background:var(--red);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .brand-pill{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.7);border:1px solid #333;color:#aaa;font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:2px;}
  .cinfo{padding:1rem 1.1rem 1.4rem;border-top:1px solid #161616;}
  .ccat{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:#383838;margin-bottom:7px;}
  .cname{font-size:14px;font-weight:400;color:#bbb;margin-bottom:5px;line-height:1.35;}
  .cdesc{font-size:11.5px;color:#484848;margin-bottom:10px;line-height:1.55;}
  .csizes{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
  .szpill{font-size:9px;letter-spacing:1px;color:#555;border:1px solid var(--border2);padding:2px 7px;border-radius:2px;}
  .cfoot{display:flex;align-items:flex-end;justify-content:space-between;}
  .old-price{font-size:11px;color:#555;text-decoration:line-through;letter-spacing:.5px;display:block;margin-bottom:1px;}
  .cprice{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:1px;color:#e0e0e0;line-height:1;}
  .cprice.sale-price{color:#e74c3c;}
  .colors-row{display:flex;gap:5px;align-items:center;padding-bottom:2px;}
  .cdot{width:10px;height:10px;border-radius:50%;border:1px solid #2a2a2a;flex-shrink:0;}

  .sfooter{padding:2.5rem 2rem 6rem;border-top:1px solid #161616;display:flex;justify-content:space-between;align-items:center;}
  .fbn{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:5px;color:#252525;}
  .fbs{font-size:9px;letter-spacing:3px;color:#222;text-transform:uppercase;}

  /* MODAL */
  .mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:999;align-items:center;justify-content:center;}
  .mbg.open{display:flex;}
  .dmod{background:var(--bg2);border:1px solid #1e1e1e;border-radius:4px;width:92%;max-width:860px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;}
  .dmod-body{display:flex;gap:0;flex:1;}
  .dmod-gallery{width:55%;background:var(--bg3);position:relative;flex-shrink:0;}
  .dmod-main-img{width:100%;aspect-ratio:3/4;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg3);}
  .dmod-main-img img{width:100%;height:100%;object-fit:contain;display:block;}
  .dmod-main-img svg{opacity:.12;}
  .dmod-thumbs{display:flex;gap:6px;padding:10px;background:var(--bg2);flex-wrap:wrap;}
  .dthumb{width:54px;height:68px;border-radius:2px;overflow:hidden;cursor:pointer;border:1px solid var(--border2);flex-shrink:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;transition:border-color .2s;}
  .dthumb:hover,.dthumb.active{border-color:#666;}
  .dthumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .dmod-info{flex:1;padding:2rem 1.8rem;display:flex;flex-direction:column;gap:14px;min-width:0;}
  .dmod-close{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.6);border:none;color:#888;cursor:pointer;font-size:18px;line-height:1;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:color .2s;z-index:10;}
  .dmod-close:hover{color:#fff;}
  .dmod-cat{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#444;}
  .dmod-name{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;color:#fff;line-height:1.05;}
  .dmod-brand{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#555;margin-top:-8px;}
  .dmod-price-block{display:flex;align-items:baseline;gap:12px;}
  .dmod-old{font-size:14px;color:#555;text-decoration:line-through;}
  .dmod-price{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:1px;color:#e0e0e0;line-height:1;}
  .dmod-price.sp{color:#e74c3c;}
  .dmod-seal{background:var(--red);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:16px;padding:4px 10px;border-radius:2px;}
  .dmod-section-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#444;margin-bottom:8px;}
  .dmod-colors{display:flex;gap:8px;flex-wrap:wrap;}
  .dmod-color{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--border2);border-radius:2px;cursor:pointer;font-size:11px;color:#666;letter-spacing:.5px;transition:all .2s;}
  .dmod-color:hover{border-color:#444;color:#aaa;}
  .dmod-color.selected{border-color:#fff;color:#fff;background:#1a1a1a;}
  .dmod-color .dc{width:12px;height:12px;border-radius:50%;border:1px solid #333;flex-shrink:0;}
  .dmod-sizes{display:flex;gap:6px;flex-wrap:wrap;}
  .dsz{padding:6px 14px;border:1px solid var(--border2);border-radius:2px;font-size:12px;color:#777;letter-spacing:1px;cursor:pointer;transition:all .2s;}
  .dsz:hover{border-color:#555;color:#aaa;}
  .dsz.active{border-color:#fff;color:#fff;}
  .dmod-desc{font-size:13px;color:#555;line-height:1.65;}
  .dmod-badge{display:inline-block;font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:2px;}

  /* DETAIL ACTION BUTTONS */
  .dmod-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .btn-whats{width:100%;background:var(--green);color:#fff;border:none;padding:13px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-whats:hover{background:#1ebe5d;}
  .btn-add-cart{width:100%;background:var(--bg);color:#aaa;border:1px solid #2a2a2a;padding:13px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-add-cart:hover{border-color:#555;color:#e8e8e8;}
  .btn-add-cart.added{border-color:#555;color:#fff;background:#1a1a1a;}
  .btn-text{transition:opacity .2s;}
  .btn-add-keep{width:100%;background:transparent;color:#555;border:1px solid #1a1a1a;padding:11px;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn-add-keep:hover{border-color:#333;color:#888;}

  /* CART DRAWER */
  .cart-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;}
  .cart-overlay.open{display:block;}
.cart-drawer{
  position:fixed;
  top:80px;
  right:20px;
  width:360px;
  max-height:80vh;
  background:rgba(15,15,15,.96);
  backdrop-filter:blur(14px);
  border:1px solid #222;
  border-radius:16px;
  z-index:600;
  display:flex;
  flex-direction:column;
  overflow:hidden;

  transform:translateY(-20px) scale(.95);
  opacity:0;
  pointer-events:none;

  transition:
    transform .28s cubic-bezier(.4,0,.2,1),
    opacity .28s ease;
    
  box-shadow:
    0 20px 60px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.03);
}
  .cart-drawer.open{
  transform:translateY(0) scale(1);
  opacity:1;
  pointer-events:auto;
}
  .cart-hdr{padding:1.2rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .cart-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;color:#fff;display:flex;align-items:center;gap:10px;}
  .cart-count-pill{background:var(--border2);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:1px;padding:3px 8px;border-radius:10px;}
  .cart-close-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:color .2s;}
  .cart-close-btn:hover{color:#fff;}
  .cart-items{flex:1;overflow-y:auto;padding:1rem 1.4rem;scrollbar-width:thin;scrollbar-color:#2a2a2a var(--bg2);display:flex;flex-direction:column;gap:10px;}
  .cart-items::-webkit-scrollbar{width:3px;}
  .cart-items::-webkit-scrollbar-track{background:var(--bg2);}
  .cart-items::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:2px;}
  .cart-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#2a2a2a;padding:2rem;text-align:center;}
  .cart-empty svg{opacity:.15;}
  .cart-empty p{font-size:12px;letter-spacing:2px;text-transform:uppercase;}

  /* CART ITEM */
  .ci{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:10px;display:flex;gap:10px;animation:ciIn .25s ease;}
  @keyframes ciIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  .ci-thumb{width:52px;height:66px;border-radius:2px;overflow:hidden;background:var(--bg3);flex-shrink:0;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
  .ci-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .ci-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .ci-name{font-size:12px;color:#aaa;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ci-meta{font-size:10px;color:var(--muted);letter-spacing:.5px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .ci-meta span{background:var(--bg3);border:1px solid var(--border);padding:1px 6px;border-radius:1px;}
  .ci-foot{display:flex;align-items:center;justify-content:space-between;margin-top:4px;}
  .ci-price{font-family:'Bebas Neue',sans-serif;font-size:16px;color:#888;letter-spacing:1px;}
  .ci-qty{display:flex;align-items:center;}
  .ci-qty button{background:var(--bg3);border:1px solid var(--border2);color:var(--muted);width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .ci-qty button:first-child{border-radius:2px 0 0 2px;}
  .ci-qty button:last-child{border-radius:0 2px 2px 0;}
  .ci-qty button:hover{background:var(--border2);color:#fff;}
  .ci-qty span{background:var(--bg3);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);color:#ccc;font-size:12px;width:26px;height:22px;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
  .ci-rm{background:none;border:none;color:#2a2a2a;cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;transition:color .15s;align-self:flex-start;}
  .ci-rm:hover{color:var(--red);}

  /* CART FOOTER */
  .cart-ftr{border-top:1px solid var(--border);padding:1.2rem 1.4rem;flex-shrink:0;display:flex;flex-direction:column;gap:10px;}
  .cart-total-row{display:flex;justify-content:space-between;align-items:baseline;}
  .cart-total-lbl{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);}
  .cart-total-val{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:#fff;}
  .btn-checkout{width:100%;background:#fff;color:#000;border:none;padding:14px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-checkout:hover{background:#ddd;}

  /* MOBILE BOTTOM BAR */
  .mobile-bar{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:.9rem 1.2rem;z-index:300;align-items:center;justify-content:space-between;gap:12px;}
  .mobile-bar.has-items{display:flex;}
  .mb-info{display:flex;flex-direction:column;}
  .mb-count{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .mb-total{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:#fff;}
  .mb-btn{background:#fff;color:#000;border:none;padding:11px 20px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:background .2s;white-space:nowrap;flex-shrink:0;}
  .mb-btn:hover{background:#ddd;}

  @keyframes addFlash{0%{transform:scale(1);}40%{transform:scale(1.06);}100%{transform:scale(1);}}
  .flash{animation:addFlash .3s ease;}

  @media (max-width:768px){
    .hdr{padding:0 1rem;}
    .brand-bar{padding:.6rem 1rem;}
    .pgrid{grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;}
    .cname{font-size:12px;}
    .cdesc{display:none;}
    .cprice{font-size:18px;}
    .cinfo{padding:.6rem .6rem .9rem;}
    .csizes{display:none;}
    .dmod{width:100%;height:100%;max-height:100%;border-radius:0;}
    .dmod-body{flex-direction:column;}
    .dmod-gallery{width:100%;}
    .dmod-info{padding:1.4rem;gap:12px;}
    .dmod-name{font-size:26px;}
    .dmod-price{font-size:30px;}
    .sfooter{flex-direction:column;gap:12px;text-align:center;padding:2rem 1rem 7rem;}
    .cart-drawer{
  top:auto;
  bottom:12px;
  right:12px;
  left:12px;
  width:auto;
  max-height:78vh;
  border-radius:18px;
}
.cart-overlay{
  backdrop-filter:blur(4px);
}
    .cart-btn-label{display:none;}
  }
</style>
</head>
<body>
<div class="sr">

  <header class="hdr">
    <div class="logo">Too Blessed<span>Imports</span></div>
    <div class="nav-scroll">
      <nav><ul class="nav-links" id="navLinks">
        <li><button class="active" onclick="setCat('todos',this)">Todos</button></li>
      </ul></nav>
    </div>
    <div class="hdr-right">
      <button class="cart-btn" onclick="openCart()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" flex-shrink="0">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        <span class="cart-btn-label">Sacola</span>
        <span class="cart-badge hidden" id="cartBadge">0</span>
      </button>
    </div>
  </header>

 <section style="
  padding:2rem;
  border-bottom:1px solid #0d0d0d;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:14px;
">

  <div style="
    width:260px;
    height:190px;
    border-radius:3px;
    overflow:hidden;
    background:#111;
    position:relative;
  ">
    <img 
      src="https://res.cloudinary.com/daqguurar/image/upload/v1776990459/gncdezqqpmwppz2dvpao.png"
      alt="Coleção"
      style="
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:contain;
        background:#111;
      "
    />
  </div>

  <div style="text-align:center;">
  <p style="
    font-size:11px;
    color:#444;
    letter-spacing:2.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  ">
    Temporada Atual
  </p>

  <strong 
    id="seasonText"
    style="
      font-size:13px;
      color:#666;
      font-weight:300;
      letter-spacing:1px;
      display:block;
      margin-bottom:6px;
    "
  >
    Carregando...

<script>
const WHATS_NUMBER = "5511999602266";

const firebaseConfig = {
  apiKey: "AIzaSyD9fPLS2maJ6YtDqREx0ZL5VIBS7jMQVHc",
  authDomain: "mostruario-9d9b3.firebaseapp.com",

  appId: "1:137348904028:web:d58cf29a4ee4e493b02299"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const svgFb = {
  tenis:`<svg width="56" height="56" viewBox="0 0 90 90" fill="none"><path d="M12 58c0 0 8-10 18-12l10-2 12-16 12-5 8 3 2 10-5 5-20 5-7 10-30 2z" stroke="#fff" stroke-width="1.5" fill="none"/><path d="M12 58l2 8h62l2-8" stroke="#fff" stroke-width="1.5" fill="none"/></svg>`,
  roupas:`<svg width="56" height="56" viewBox="0 0 90 90" fill="none"><path d="M30 18l-18 12 8 6 3-3v36h44V33l3 3 8-6-18-12c0 0-5 10-15 10s-15-10-15-10z" stroke="#fff" stroke-width="1.5" fill="none"/></svg>`,
  acessorios:`<svg width="56" height="56" viewBox="0 0 90 90" fill="none"><rect x="22" y="34" width="46" height="40" rx="3" stroke="#fff" stroke-width="1.5" fill="none"/><path d="M32 34v-8a13 13 0 0126 0v8" stroke="#fff" stroke-width="1.5" fill="none"/></svg>`
};

let products=[], brands=[], categories=[];
let curCat='todos', curBrand='todas';
let selectedSize=null, selectedColor=null, currentProduct=null;

// ===== CART =====
let cart = [];

function loadCart(){
  try{ cart = JSON.parse(localStorage.getItem('tbimports_cart')) || []; }
  catch(e){ cart=[]; }
}
function saveCart(){ localStorage.setItem('tbimports_cart', JSON.stringify(cart)); }

function cartItemKey(p, size, color){
  return p.id+'__'+(size||'')+'__'+(color?color.hex:'');
}

function addToCart(p, size, color, closeAfter){
  const key = cartItemKey(p, size, color);
  const ex = cart.find(i=>i.key===key);
  if(ex){ ex.qty++; }
  else {
    cart.push({
      key, id:p.id, name:p.name, price:p.price,
      cat:p.cat, brand:p.brand||null,
      photo:(p.photos&&p.photos[0])||null,
      size:size||null, color:color||null, qty:1
    });
  }
  saveCart(); updateCartUI(); bumpBadge();
  if(closeAfter) closeMod('dbg');
}

function removeFromCart(key){
  cart = cart.filter(i=>i.key!==key);
  saveCart(); updateCartUI();
}

function changeQty(key, delta){
  const item = cart.find(i=>i.key===key);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ removeFromCart(key); return; }
  saveCart(); updateCartUI();
}

function cartTotal(){ return cart.reduce((s,i)=>s+i.price*i.qty,0); }
function cartQty(){ return cart.reduce((s,i)=>s+i.qty,0); }
function fmt(n){ return 'R$'+n.toFixed(2).replace('.',','); }

function bumpBadge(){
  const b = document.getElementById('cartBadge');
  b.classList.remove('bump','flash');
  void b.offsetWidth;
  b.classList.add('bump','flash');
  setTimeout(()=>b.classList.remove('bump','flash'),400);
}

function updateCartUI(){
  const qty = cartQty();
  const total = cartTotal();

  const badge = document.getElementById('cartBadge');
  badge.textContent = qty;
  badge.classList.toggle('hidden', qty===0);

  document.getElementById('drawerCount').textContent = qty===1?'1 item':qty+' itens';
  document.getElementById('cartTotal').textContent = fmt(total);

  const ftr = document.getElementById('cartFtr');
  ftr.style.display = cart.length ? 'flex' : 'none';
  if(cart.length) ftr.style.flexDirection = 'column';

  const mb = document.getElementById('mobileBar');
  mb.classList.toggle('has-items', qty>0);
  document.getElementById('mbCount').textContent = qty===1?'1 item':qty+' itens';
  document.getElementById('mbTotal').textContent = fmt(total);

  renderCartItems();
}

function renderCartItems(){
  const el = document.getElementById('cartItems');
  if(!cart.length){
    el.innerHTML=`<div class="cart-empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      <p>Sua sacola está vazia</p>
    </div>`;
    return;
  }
  el.innerHTML = cart.map(item=>{
    const colorLabel = item.color?(item.color.name||item.color.hex):null;
    return `<div class="ci">
      <div class="ci-thumb">${item.photo
        ?`<img src="${item.photo}" alt="${item.name}"/>`
        :`<svg width="26" height="26" viewBox="0 0 90 90" fill="none" opacity=".15"><path d="M30 18l-18 12 8 6 3-3v36h44V33l3 3 8-6-18-12c0 0-5 10-15 10s-15-10-15-10z" stroke="#fff" stroke-width="1.5" fill="none"/></svg>`}
      </div>
      <div class="ci-body">
        <div class="ci-name">${item.name}</div>
        <div class="ci-meta">
          ${item.size?`<span>📏 ${item.size}</span>`:''}
          ${colorLabel?`<span style="display:flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;border-radius:50%;background:${item.color.hex};border:1px solid #333;display:inline-block;flex-shrink:0;"></span>${colorLabel}</span>`:''}
          ${item.brand?`<span>${item.brand}</span>`:''}
        </div>
        <div class="ci-foot">
          <div class="ci-qty">
            <button onclick="changeQty('${item.key}',-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="changeQty('${item.key}',1)">+</button>
          </div>
          <div class="ci-price">${fmt(item.price*item.qty)}</div>
        </div>
      </div>
      <button class="ci-rm" onclick="removeFromCart('${item.key}')">×</button>
    </div>`;
  }).join('');
}

function openCart(){
  document.getElementById('cartDrawer').classList.add('open');
  document.getElementById('cartOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeCart(){
  document.getElementById('cartDrawer').classList.remove('open');
  document.getElementById('cartOverlay').classList.remove('open');
  document.body.style.overflow='';
}

// ===== FINALIZAR PEDIDO =====
function finalizarPedido(){
  if(!cart.length) return;
  const nome = prompt("Digite seu nome para continuar:");
  if(!nome||!nome.trim()) return;

  let linhas='';
  let subtotal=0;
  cart.forEach((item,idx)=>{
    const colorLabel = item.color?(item.color.name||item.color.hex):null;
    const sub = item.price*item.qty;
    subtotal += sub;
    linhas += `%0A%0A${idx+1}. *${encodeURIComponent(item.name)}*`;
    if(item.brand)   linhas += `%0A   🏷️ Marca: ${encodeURIComponent(item.brand)}`;
    if(item.size)    linhas += `%0A   📏 Tamanho: ${encodeURIComponent(item.size)}`;
    if(colorLabel)   linhas += `%0A   🎨 Cor: ${encodeURIComponent(colorLabel)}`;
    linhas += `%0A   🔢 Qtd: ${item.qty}`;
    linhas += `%0A   💵 Subtotal: ${encodeURIComponent(fmt(sub))}`;
  });

  const texto =
    `Olá, me chamo ${encodeURIComponent(nome.trim())}%0A`+
    `Gostaria de fazer um pedido:`+
    linhas+
    `%0A%0A━━━━━━━━━━━━━━%0A`+
    `🛒 *${cart.length} ${cart.length===1?'produto':'produtos'}*%0A`+
    `💰 *Total: ${encodeURIComponent(fmt(subtotal))}*`;

  window.open(`https://wa.me/${WHATS_NUMBER}?text=${texto}`,"_blank");
}

async function loadConfig(){
  try{
    const b = await db.collection("config").doc("brands").get();
    brands = b.exists?(b.data().list||[]):[];
    const c = await db.collection("config").doc("categories").get();
    categories = c.exists?(c.data().list||['tenis','roupas','acessorios']):['tenis','roupas','acessorios'];
  }catch(e){ brands=[]; categories=['tenis','roupas','acessorios']; }
}
async function load(){
  try{
    const snap = await db.collection("produtos").get();
    products = snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ products=[]; }
}

  const nav = document.getElementById('navLinks');
  nav.innerHTML=`<li><button class="${curCat==='todos'?'active':''}" onclick="setCat('todos',this)">Todos</button></li>`;
  categories.forEach(c=>{
    const li = document.createElement('li');
    li.innerHTML=`<button class="${curCat===c?'active':''}" onclick="setCat('${c}',this)">${c.charAt(0).toUpperCase()+c.slice(1)}</button>`;
    nav.appendChild(li);
  });

function buildBrandBar(){
  const bar=document.getElementById('brandBar');
  const btns=document.getElementById('brandBtns');
  let rel = curCat==='todos'?[...products]:products.filter(p=>p.cat===curCat);
  const avail=[...new Set(rel.map(p=>p.brand).filter(Boolean))];
  if(!avail.length){bar.classList.add('hidden');return;}
  bar.classList.remove('hidden');
  btns.innerHTML=`<button class="brbtn${curBrand==='todas'?' active':''}" onclick="setBrand('todas',this)">Todas</button>`+
    avail.map(b=>`<button class="brbtn${curBrand===b?' active':''}" onclick="setBrand('${b}',this)">${b}</button>`).join('');
}

function setCat(c,el){
  curCat=c; curBrand='todas';
  document.querySelectorAll('.nav-links button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  buildBrandBar(); render();
}

  curBrand=b;
  document.querySelectorAll('.brbtn').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');

}

function render(){
  let list = curCat==='todos'?[...products]:products.filter(p=>p.cat===curCat);

    document.getElementById('grid').innerHTML=`<div style="grid-column:1/-1;padding:4rem 2rem;text-align:center;color:#2a2a2a;font-size:13px;letter-spacing:2px;text-transform:uppercase;">Nenhum produto encontrado</div>`;
    return;
  }
  document.getElementById('grid').innerHTML=list.map(p=>{
    const cover=p.photos&&p.photos[0];
    const hasSale=p.badge==='sale'&&p.oldPrice&&p.discount;
    const fallback=svgFb[p.cat]||svgFb.roupas;
    return `<div class="pcard" onclick="openDetail('${p.id}')">
      <div class="img-wrap">
        <div class="pimg-inner">${cover?`<img src="${cover}" alt="${p.name}"/>`:fallback}</div>
        ${p.badge?`<div class="badge badge-${p.badge}">${p.badge==='novo'?'Novo':p.badge==='destaque'?'Destaque':'Sale'}</div>`:''}

            <div class="cprice${hasSale?' sale-price':''}">R$${p.price}</div>
          </div>
          <div class="colors-row">${(p.colors||[]).map(c=>`<div class="cdot" style="background:${c.hex}" title="${c.name||c.hex}"></div>`).join('')}</div>

function closeMod(id){ document.getElementById(id).classList.remove('open'); }

function selectSize(size,el){
  selectedSize=size;
  document.querySelectorAll('.dsz').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
}
function selectColor(colorObj,el){
  selectedColor=colorObj;
  document.querySelectorAll('.dmod-color').forEach(d=>d.classList.remove('selected'));
  el.classList.add('selected');
}
function validateSelections(p){
  if(p.sizes&&p.sizes.length>0&&!selectedSize){alert("Selecione um tamanho antes de continuar.");return false;}
  if(p.colors&&p.colors.length>0&&!selectedColor){alert("Selecione uma cor antes de continuar.");return false;}
  return true;
}

function setAddedState(on){
  const btn=document.getElementById('addCartBtn');
  if(!btn) return;
  if(on){
    btn.classList.add('added');
    btn.querySelector('.btn-text').textContent='✓ Adicionado';
  } else {
    btn.classList.remove('added');
    btn.querySelector('.btn-text').textContent='Adicionar +';
  }
}

  if(!currentProduct||!validateSelections(currentProduct)) return;
  addToCart(currentProduct, selectedSize, selectedColor, false);
  setAddedState(true);
  setTimeout(()=>setAddedState(false), 1800);
}

  const colorLabel=selectedColor?(selectedColor.name||selectedColor.hex):null;
  const colorInfo=colorLabel?`%0A🎨 Cor: ${encodeURIComponent(colorLabel)}`:'';
  const texto=`Olá, me chamo ${encodeURIComponent(nome.trim())}%0ATenho interesse no produto:%0A%0A🛍️ *${encodeURIComponent(p.name)}*${brandInfo}${sizeInfo}${colorInfo}%0A💰 Preço: R$${p.price}%0A%0A${encodeURIComponent(p.desc)}`;
  window.open(`https://wa.me/${WHATS_NUMBER}?text=${texto}`,"_blank");
}

(async()=>{
  loadCart();
  await loadConfig();
  await load();
  buildNav();
  buildBrandBar();
  render();
  updateCartUI();
})();

function getBrazilSeason() {
  const now = new Date();

  const day = now.getDate();
  const month = now.getMonth() + 1;

  let season = "";

  // ESTAÇÕES NO BRASIL
  if (
    (month === 12 && day >= 21) ||
    month === 1 ||
    month === 2 ||
    (month === 3 && day < 20)
  ) {
    season = "Verão";
  }

  else if (
    (month === 3 && day >= 20) ||
    month === 4 ||
    month === 5 ||
    (month === 6 && day < 21)
  ) {
    season = "Outono";
  }

  else if (
    (month === 6 && day >= 21) ||
    month === 7 ||
    month === 8 ||
    (month === 9 && day < 22)
  ) {
    season = "Inverno";
  }

  else {
    season = "Primavera";
  }

  const year = now.getFullYear();

  document.getElementById("seasonText").innerText =
    `${season} — ${year}`;

  // DATA REAL BRASIL
  const dataBrasil = now.toLocaleDateString("pt-BR", {
    timeZone: "America/Sao_Paulo",
    day: "2-digit",
    month: "long",
    year: "numeric"
  });

  const horaBrasil = now.toLocaleTimeString("pt-BR", {
    timeZone: "America/Sao_Paulo",
    hour: "2-digit",
    minute: "2-digit"
  });

  document.getElementById("brDate").innerText =
    `${dataBrasil} • ${horaBrasil}`;
}

getBrazilSeason();

setInterval(getBrazilSeason, 1000);

</script>
